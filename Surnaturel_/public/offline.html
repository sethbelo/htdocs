<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne — Surnaturel Print</title>
<style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #333; background: #f3f6f7 url('/images/backgrounds/ink-light.webp') center / cover no-repeat; }
    @media (prefers-color-scheme: dark) { body { color: #eef4f6; background-color: #0a1b23; background-image: url('/images/backgrounds/ink-dark.webp'); } .card { background: #0f2530 !important; border-color: #1d3a48 !important; } }
    .card { max-width: 420px; margin: 24px; padding: 32px; border-radius: 20px; background: #fff; border: 1px solid #e4e9ec; box-shadow: 0 24px 48px -20px rgba(10,38,51,.35); text-align: center; }
    h1 { font-size: 22px; margin: 18px 0 8px; color: inherit; }
    p { line-height: 1.55; color: #6b787f; }
    button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; background: #134a63; color: #fff; cursor: pointer; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px; }
</style>
</head>
<body>
    <div class="card">
        <img src="/brand/logo.svg" alt="Surnaturel Print" style="height:48px">
        <h1>Connexion interrompue</h1>
        <p>L’application a perdu le contact avec le serveur. Vos données sont en sécurité dans le cloud : dès le retour du réseau, la synchronisation reprend automatiquement.</p>
        <div><span class="dot" style="background:#53bdc5"></span><span class="dot" style="background:#ffce34"></span><span class="dot" style="background:#db0d17"></span></div>
        <button onclick="location.reload()">Réessayer</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
