<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOGEREF ERP</title>
    <style>
        :root { color-scheme: light dark; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #171717; background: radial-gradient(circle at 75% 10%, rgba(37,99,235,.16), transparent 35%), linear-gradient(145deg,#f8fafc,#eef2ff); }
        main { width: min(580px, calc(100% - 40px)); padding: 46px; border: 1px solid rgba(148,163,184,.28); border-radius: 28px; background: rgba(255,255,255,.92); box-shadow: 0 28px 80px rgba(15,23,42,.16); }
        img { width: 74px; height: 74px; border-radius: 18px; box-shadow: 0 14px 30px rgba(37,99,235,.24); }
        .tag { margin-top: 28px; color: #2563eb; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 8px 0 12px; font-size: 32px; letter-spacing: -.04em; }
        p { margin: 0; color: #64748b; font-size: 15px; line-height: 1.7; }
        .support { margin-top: 28px; padding: 16px 18px; border-radius: 15px; color: #334155; background: #f1f5f9; font-size: 13px; }
        .support strong { display: block; margin-bottom: 3px; color: #0f172a; }
        @media (prefers-color-scheme: dark) { body { color: #f8fafc; background: radial-gradient(circle at 75% 10%,rgba(59,130,246,.18),transparent 35%),#090b10; } main { border-color: #27272a; background: rgba(18,20,27,.95); box-shadow: 0 28px 80px #0008; } p { color: #94a3b8; } .support { color: #cbd5e1; background: #181b23; } .support strong { color: white; } }
    </style>
</head>
<body>
    <main>
        <img src="icons/sogeref-light.png" alt="SOGEREF ERP">
        <div class="tag" id="status">Licence d’exploration</div>
        <h1 id="title">Démarrage impossible</h1>
        <p id="message">Une erreur empêche le démarrage de l’application.</p>
        <div class="support"><strong>Assistance Yetoo Technologies</strong>Communiquez le nom de l’application et la date affichée à votre responsable de licence.</div>
    </main>
    <script>
        const parameters = new URLSearchParams(location.search);
        document.getElementById('title').textContent = parameters.get('title') || 'SOGEREF ERP';
        document.getElementById('message').textContent = parameters.get('message') || 'Contactez Yetoo Technologies.';
        document.getElementById('status').textContent = parameters.get('status') === 'expired' ? 'Période terminée' : 'Protection Desktop';
    </script>
</body>
</html>
