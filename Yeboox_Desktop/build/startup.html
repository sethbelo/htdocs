<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Démarrage de Yeboox Desktop 9.0</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            display: grid;
            place-items: center;
            color: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 18% 16%, rgba(34, 211, 238, .22), transparent 34%),
                radial-gradient(circle at 86% 82%, rgba(124, 58, 237, .34), transparent 42%),
                linear-gradient(145deg, #050816, #111a54 58%, #171042);
            user-select: none;
        }
        .glow {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 999px;
            animation: breathe 2.4s ease-in-out infinite;
        }
        .panel { position: relative; width: 100%; padding: 42px 54px 36px; text-align: center; }
        .logo-wrap {
            display: grid;
            width: 82px;
            height: 82px;
            margin: 0 auto 20px;
            place-items: center;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 25px;
            background: rgba(255,255,255,.1);
            box-shadow: 0 22px 70px rgba(3, 7, 36, .45);
            backdrop-filter: blur(14px);
        }
        img { width: 58px; height: 58px; border-radius: 17px; }
        h1 { margin: 0; font-size: 25px; font-weight: 750; letter-spacing: -.025em; }
        p { margin: 8px 0 0; color: rgba(255,255,255,.68); font-size: 13px; }
        .progress {
            position: relative;
            width: 260px;
            height: 4px;
            margin: 30px auto 14px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255,255,255,.12);
        }
        .progress::after {
            position: absolute;
            inset: 0 auto 0 -45%;
            width: 45%;
            border-radius: inherit;
            background: linear-gradient(90deg, #22d3ee, #818cf8, #c084fc);
            content: "";
            animation: loading 1.35s ease-in-out infinite;
        }
        .status { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
        .brand { position: absolute; right: 20px; bottom: 14px; color: rgba(255,255,255,.42); font-size: 9px; letter-spacing: .08em; }
        @keyframes loading { 0% { left: -45%; } 100% { left: 100%; } }
        @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: .75; transform: scale(1.08); } }
        @media (prefers-reduced-motion: reduce) { .glow, .progress::after { animation-duration: 3s; } }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <main class="panel">
        <div class="logo-wrap"><img src="icon.png" alt=""></div>
        <h1>Yeboox Desktop <small>9.0</small></h1>
        <p>SQLite et votre espace de gestion se préparent.</p>
        <div class="progress" aria-hidden="true"></div>
        <p class="status">Démarrage sécurisé de SQLite</p>
        <span class="brand">UNE SOLUTION YETU TECHNOLOGIE</span>
    </main>
</body>
</html>
