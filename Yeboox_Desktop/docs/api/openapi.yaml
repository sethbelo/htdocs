openapi: 3.1.0
info:
  title: API mobile Yeboox
  version: 1.0.0
  description: API sécurisée pour applications Android et terminaux externes.
servers:
  - url: https://votre-domaine.example/api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentification
  - name: Initialisation
  - name: Catalogue
  - name: Clients
  - name: Rendez-vous
  - name: Caisse
  - name: Ventes
paths:
  /auth/login:
    post:
      tags: [Authentification]
      security: []
      summary: Connecter un appareil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 80 }
      responses:
        '200': { description: Jeton et profil, content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Trop de tentatives }
  /auth/me:
    get:
      tags: [Authentification]
      summary: Profil du jeton courant
      responses:
        '200': { description: Profil connecté }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    delete:
      tags: [Authentification]
      summary: Révoquer le jeton courant
      responses:
        '200': { description: Appareil déconnecté }
  /bootstrap:
    get:
      tags: [Initialisation]
      summary: Charger la configuration nécessaire au terminal
      responses:
        '200': { description: Société, devises, capacités et référentiels }
  /products:
    get:
      tags: [Catalogue]
      summary: Catalogue paginé
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [product, service, combo] } }
        - { name: active, in: query, schema: { type: boolean, default: true } }
        - { $ref: '#/components/parameters/UpdatedAfter' }
      responses:
        '200': { description: Produits, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCursorPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{id}:
    get:
      tags: [Catalogue]
      summary: Détail d’un produit
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Produit }
        '404': { description: Produit introuvable }
  /customers:
    get:
      tags: [Clients]
      summary: Liste paginée des clients
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/UpdatedAfter' }]
      responses: { '200': { description: Clients paginés } }
    post:
      tags: [Clients]
      summary: Créer un client
      requestBody: { $ref: '#/components/requestBodies/Customer' }
      responses:
        '201': { description: Client créé }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers/{id}:
    get:
      tags: [Clients]
      summary: Détail d’un client
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Client } }
    put:
      tags: [Clients]
      summary: Modifier un client
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Customer' }
      responses: { '200': { description: Client modifié }, '422': { $ref: '#/components/responses/ValidationError' } }
  /appointments:
    get:
      tags: [Rendez-vous]
      summary: Liste paginée des rendez-vous
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/PerPage' }]
      responses: { '200': { description: Rendez-vous paginés } }
    post:
      tags: [Rendez-vous]
      summary: Créer un rendez-vous
      requestBody: { $ref: '#/components/requestBodies/Appointment' }
      responses: { '201': { description: Rendez-vous créé }, '422': { $ref: '#/components/responses/ValidationError' } }
  /appointments/{id}:
    get:
      tags: [Rendez-vous]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Rendez-vous } }
    put:
      tags: [Rendez-vous]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Appointment' }
      responses: { '200': { description: Rendez-vous modifié } }
  /register/current:
    get:
      tags: [Caisse]
      summary: Caisse ouverte de l’utilisateur
      responses: { '200': { description: Session ou data null } }
  /register/open:
    post:
      tags: [Caisse]
      summary: Ouvrir une caisse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opening_balance_usd, opening_balance_cdf]
              properties:
                opening_balance_usd: { type: number, minimum: 0 }
                opening_balance_cdf: { type: number, minimum: 0 }
                note: { type: string, maxLength: 500 }
      responses: { '201': { description: Caisse ouverte }, '422': { $ref: '#/components/responses/ValidationError' } }
  /register/close:
    post:
      tags: [Caisse]
      summary: Clôturer la caisse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closing_balance_usd, closing_balance_cdf]
              properties:
                closing_balance_usd: { type: number, minimum: 0 }
                closing_balance_cdf: { type: number, minimum: 0 }
                note: { type: string, maxLength: 1000 }
      responses: { '200': { description: Caisse clôturée }, '422': { $ref: '#/components/responses/ValidationError' } }
  /sales:
    get:
      tags: [Ventes]
      summary: Historique paginé autorisé
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/PerPage' }, { $ref: '#/components/parameters/UpdatedAfter' }]
      responses: { '200': { description: Ventes paginées } }
    post:
      tags: [Ventes]
      summary: Encaisser une vente idempotente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSale' }
      responses:
        '201': { description: Vente créée }
        '200': { description: Vente déjà créée, répétition idempotente }
        '409': { description: Référence appartenant à un autre utilisateur }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sales/{id}:
    get:
      tags: [Ventes]
      summary: Détail d’une vente autorisée
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Vente }, '403': { $ref: '#/components/responses/Forbidden' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    UpdatedAfter: { name: updated_after, in: query, schema: { type: string, format: date-time } }
  requestBodies:
    Customer:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 255 }
              phone: { type: [string, 'null'], maxLength: 50 }
              email: { type: [string, 'null'], format: email }
              is_active: { type: boolean }
    Appointment:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              customer_id: { type: integer }
              employee_id: { type: integer }
              service_id: { type: integer }
              date_time: { type: string, format: date-time }
              status: { type: string, enum: [pending, confirmed, completed, cancelled] }
              notes: { type: [string, 'null'] }
  schemas:
    LoginEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            token_type: { type: string, const: Bearer }
            expires_at: { type: string, format: date-time }
            abilities: { type: array, items: { type: string } }
            user: { type: object }
    Product:
      type: object
      required: [id, sku, name, type, net_price, gross_price, tax_rate, stock_quantity]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        category: { type: [string, 'null'] }
        type: { type: string, enum: [product, service, combo] }
        price: { type: number }
        net_price: { type: number }
        gross_price: { type: number }
        tax_rate: { type: number }
        tax_included: { type: boolean }
        stock_quantity: { type: number }
        alert_quantity: { type: number }
        is_active: { type: boolean }
        updated_at: { type: string, format: date-time }
    ProductCursorPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        links: { type: object }
        meta: { type: object }
    CreateSale:
      type: object
      required: [client_reference, fulfillment_type, items, payments]
      properties:
        client_reference: { type: string, maxLength: 100, description: UUID stable généré par Android }
        customer_id: { type: [integer, 'null'] }
        fulfillment_type: { type: string, enum: [dine_in, takeaway, delivery] }
        table_name: { type: [string, 'null'] }
        delivery_phone: { type: [string, 'null'] }
        delivery_address: { type: [string, 'null'] }
        discount_amount: { type: number, minimum: 0, default: 0 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              quantity: { type: number, exclusiveMinimum: 0 }
        payments:
          type: array
          minItems: 1
          items:
            type: object
            required: [method, currency, amount]
            properties:
              method: { type: string, enum: [cash, bank, mobile_money, yepay] }
              currency: { type: string, enum: [USD, CDF] }
              amount: { type: number, minimum: 0 }
              received: { type: number, minimum: 0 }
              provider: { type: [string, 'null'] }
              reference: { type: [string, 'null'] }
  responses:
    Unauthenticated: { description: Jeton absent, invalide ou expiré }
    Forbidden: { description: Capacité du jeton ou permission du rôle insuffisante }
    ValidationError: { description: Données ou règle métier invalides }
